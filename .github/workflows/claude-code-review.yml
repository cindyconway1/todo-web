name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # Timeout for the entire GitHub job (the Claude step has its own, below).
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # timeout for this github step
        timeout-minutes: 20
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1, as of 2026-10-27
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          #
          # Two cost ceilings that work together, capping two different bills:
          #   timeout-minutes (above) -- GitHub Actions minutes, billed per
          #       wall-clock minute the runner VM is up.
          #   --max-turns -- Claude usage, which is billed per token, but 
          #       turns are the CLI option provided
          # https://code.claude.com/docs/en/github-actions (see "Manage costs")
          claude_args: |
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code.git action docs:
          # https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
