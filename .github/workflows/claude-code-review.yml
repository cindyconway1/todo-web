name: Claude Code Review

on:
  pull_request:
    # synchronize (every push to an open PR) is required, not optional, because
    # claude-review is a REQUIRED status check and the ruleset has
    # strict_required_status_checks_policy on. Without it, any push -- including
    # the branch update that strict mode forces after every merge to main --
    # leaves the new head SHA with no review run, and the required check sits on
    # "Waiting for status to be reported" until someone toggles the PR to draft
    # and back. Drop synchronize only if claude-review stops being required.
    types: [opened, ready_for_review, reopened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# With synchronize on, three pushes in a minute would start three reviews and bill
# for all three. Only the newest head matters -- the required check is evaluated
# against it -- so supersede in-flight runs for the same PR. The cancelled run
# belongs to an older SHA, so cancelling it cannot strand the check on the new one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # Timeout for the entire GitHub job (the Claude step has its own, below).
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # timeout for this github step
        timeout-minutes: 20
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1, as of 2026-10-27
        # Subagents must run in the FOREGROUND here. Since Claude Code 2.1.302 a
        # subagent starts in the background by default, and the action stops
        # reading the session at the first result message (claude-code-action
        # base-action/src/run-claude-sdk.ts, the `break` on "result"). The
        # code-review plugin's very first step is a haiku subagent, so without
        # this the main agent says "I'll continue the review once it reports
        # back", the turn ends, the action exits, and no review happens (run
        # 41463022817: 12s, $0.06, no comment). Reproduced locally on the same
        # CLI + SDK versions; with this set the full multi-agent review runs
        # to completion (~80s, ~$0.9 on a two-file diff).
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          display_report: true
          #
          # Two cost ceilings that work together, capping two different bills:
          #   timeout-minutes (above) -- GitHub Actions minutes, billed per
          #       wall-clock minute the runner VM is up.
          #   --max-turns -- Claude usage, which is billed per token, but 
          #       turns are the CLI option provided
          # https://code.claude.com/docs/en/github-actions (see "Manage costs")
          # --allowedTools REPLACES the default allowlist; agent mode builds it from
          # nothing but this list (claude-code-action src/modes/agent/parse-tools.ts).
          # Three things have to be on it, each verified against a run that failed
          # without it:
          #
          #   mcp__github_inline_comment__create_inline_comment
          #       The action only installs the inline-comment MCP server when this
          #       name is present (src/mcp/install-mcp-server.ts). Leave it out and
          #       inline comments are impossible even when the reviewer finds issues.
          #   Bash(gh pr ...), Bash(gh issue ...), Bash(gh search:*)
          #       The code-review plugin's own declared tool list (its command file's
          #       `allowed-tools` frontmatter). gh pr view/diff read the PR; gh pr
          #       comment posts the "No issues found" summary on a clean PR -- that
          #       summary is a PR comment, not an inline one.
          #   Bash(git diff/log/blame/show:*)
          #       Read-only history for the plugin's git-blame review agent.
          #
          # Anything else the reviewer tries (exploratory greps, cd into sibling
          # repos) is denied and the review still completes; the plugin tells its
          # agents not to make exploratory calls. Do not widen this to bare `Bash`.
          #
          # Note the token: inside this step `gh` runs on the app token minted by
          # Anthropic's OIDC exchange, NOT on the job's GITHUB_TOKEN, so the
          # `permissions:` block above does not bound what gh can do here. This
          # allowlist is what keeps the agent to reads plus PR comments.
          #
          # --setting-sources user: do not load this repo's .claude/settings.json
          # into the reviewer. That file puts `gh pr comment` (and gh api, gh pr
          # review, ...) under `ask` so a developer's local Claude session cannot
          # post as them. An ask rule beats an allow rule from anywhere, including
          # --allowedTools (deny > ask > allow), and in a headless run an ask is a
          # denial -- so with project settings loaded the plugin's summary comment
          # (`gh pr comment`) is silently refused. The action restores .claude/
          # from main before Claude starts, so a pre-step edit cannot fix this;
          # excluding the source does. The plugin is installed at user scope, so
          # it still loads; the reviewers read CLAUDE.md files explicitly.
          claude_args: |
            --max-turns 20
            --setting-sources user
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*)"
          # See https://github.com/anthropics/claude-code.git action docs:
          # https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
