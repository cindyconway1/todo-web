name: Claude Code Review

on:
  pull_request:
    # synchronize (every push to an open PR) is required, not optional, because
    # claude-review is a REQUIRED status check and the ruleset has
    # strict_required_status_checks_policy on. Without it, any push -- including
    # the branch update that strict mode forces after every merge to main --
    # leaves the new head SHA with no review run, and the required check sits on
    # "Waiting for status to be reported" until someone toggles the PR to draft
    # and back. Drop synchronize only if claude-review stops being required.
    types: [opened, ready_for_review, reopened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# With synchronize on, three pushes in a minute would start three reviews and bill
# for all three. Only the newest head matters -- the required check is evaluated
# against it -- so supersede in-flight runs for the same PR. The cancelled run
# belongs to an older SHA, so cancelling it cannot strand the check on the new one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # Timeout for the entire GitHub job (the Claude step has its own, below).
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # timeout for this github step
        timeout-minutes: 20
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1, as of 2026-10-27
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          display_report: true
          #
          # Two cost ceilings that work together, capping two different bills:
          #   timeout-minutes (above) -- GitHub Actions minutes, billed per
          #       wall-clock minute the runner VM is up.
          #   --max-turns -- Claude usage, which is billed per token, but 
          #       turns are the CLI option provided
          # https://code.claude.com/docs/en/github-actions (see "Manage costs")
          # Deliberately no --allowedTools. That flag REPLACES the allowlist rather
          # than extending it, and the reviewer needs open-ended shell access to do
          # its job: it reads the diff via git/gh, greps with awk and ls, and calls
          # `git worktree add` to isolate the checkout. Pinning it to a fixed command
          # list got those calls denied, so the reviewer saw nothing and posted
          # nothing -- while the job still reported success.
          #
          # The security boundary is the job's `permissions:` block above
          # (contents: read, pull-requests: read), not this list. The agent holds a
          # read-only token either way and cannot write to the repo.
          claude_args: |
            --max-turns 20
          # See https://github.com/anthropics/claude-code.git action docs:
          # https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
